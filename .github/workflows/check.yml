# The gates, on every push and pull request.
#
# Until this existed the gates ran only inside Netlify's build of the web
# app — so a change to the API, the shared package or the regulatory
# registry could merge without a single assertion running against it. The
# first deploy of this repository reported three green checks while
# building nothing at all, which is the concrete version of that problem.
name: check

on:
  # `push: ["**"]` plus `pull_request` fires BOTH on any branch with an
  # open PR, so the first run of this workflow executed every job twice
  # against the same commit. Scoping push to the default branch means a
  # PR is checked once by `pull_request` and a merge is checked once by
  # `push`, with no commit checked twice.
  push:
    branches: [main]
  pull_request:

# And if a branch is pushed again while its checks are still running,
# the older run is checking a commit nobody is waiting on any more.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres, because three of the four defects this project
    # fixed were behavioural — a chain that forked under concurrency, a
    # verifier that accepted edited rows, a join that re-identified
    # reporters. Not one of those is visible to a source-level guard.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usalamasms
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/usalamasms
      # Makes the skip guard fail rather than pass if the service above
      # is ever removed — see tests/integration/guard.test.ts.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # typecheck, brand gate, claims gate, tests — see package.json.
      - run: npm run check

      # Does the database match the code? Against the CI Postgres this is
      # trivially true — the point is that the SCRIPT is exercised on every
      # PR, so it cannot rot between the rare occasions somebody points it
      # at production. A diagnostic nobody runs is a diagnostic that is
      # wrong when it matters.
      - run: npx prisma migrate deploy
      - run: npm run check:db

      # And the same code against a real database.
      - run: npm run test:integration

      # And then the built bundle, driven in a real browser. The unit
      # tests cannot tell you the router resolves or that a report filed
      # with the radio off survives; those are the properties the
      # product is sold on, so they are checked against dist/ and not
      # against source.
      - run: npx playwright install --with-deps chromium

      # `verify`, NOT `build && smoke`, and the difference was two gates
      # that ran nowhere.
      #
      # This step used to be `npm run build` followed by `npm run smoke`,
      # which is most of what verify does and not all of it. verify also
      # runs the accessibility sweep and the two-version PWA update
      # gate — so both of those existed, passed locally, were described
      # in the README, and had no opinion whatsoever about a pull
      # request. The update gate had been in that position since it was
      # written; the a11y sweep joined it the day it was added, by
      # being wired into the one command CI did not call.
      #
      # A gate that cannot fail the thing it guards is the failure mode
      # this repository treats as worse than having no gate. Naming the
      # composite command rather than its parts is also what stops it
      # happening again: the next gate added to verify is in CI the same
      # day, without anybody remembering to add a line here.
      - run: npm run verify

  # A gate is worth what its failure is worth, and a gate nobody has
  # watched fail is a gate nobody has tested. These two cases assert that
  # the brand gate still REJECTS the things it was written to reject: a
  # risk scale that collapses under dichromacy, and a token that has been
  # renamed out from under an assertion (charter rule 11).
  #
  # If either of these starts passing, the gate has stopped checking and
  # this job fails instead of quietly going green.
  gates-still-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: A mid-green risk scale must be rejected
        run: |
          cp apps/web/src/style.css /tmp/style.bak
          sed -i 's/--us-risk-acceptable: #08301c;/--us-risk-acceptable: #1f7a4d;/' apps/web/src/style.css
          if node scripts/check-brand.mjs > /dev/null 2>&1; then
            echo "::error::The brand gate ACCEPTED a risk scale that is 1.10:1 against Ochre Red."
            exit 1
          fi
          cp /tmp/style.bak apps/web/src/style.css

      - name: A renamed token must be rejected
        run: |
          cp apps/web/src/style.css /tmp/style.bak
          sed -i 's/--us-ochre-text:/--us-ochre-text-RENAMED:/' apps/web/src/style.css
          if node scripts/check-brand.mjs > /dev/null 2>&1; then
            echo "::error::The brand gate PASSED with a token it asserts on missing (charter rule 11)."
            exit 1
          fi
          cp /tmp/style.bak apps/web/src/style.css

      - name: A rate limit with no plugin behind it must be rejected
        run: |
          cp apps/api/src/server.ts /tmp/server.bak
          sed -i 's|^import rateLimit from "@fastify/rate-limit";||' apps/api/src/server.ts
          if node scripts/check-claims.mjs > /dev/null 2>&1; then
            echo "::error::The claims gate PASSED with routes declaring config.rateLimit and no plugin registered. That is the exact state login shipped in: unbounded."
            exit 1
          fi
          cp /tmp/server.bak apps/api/src/server.ts

      # The prose gate exists because the pricing page was broken THREE
      # times by a backtick inside an HTML comment — the construct ends
      # the tagged template literal, so the markup after it parses as
      # JavaScript and the page fails at runtime with a message about an
      # undefined identifier rather than about the comment.
      #
      # These two write a probe file rather than mutating a real one, and
      # that is deliberate: the whole point of the gate is that it holds
      # over EVERY screen, so tying its proof to one file's current text
      # would make the proof go stale the moment that file is cleaned —
      # which is exactly what this change did to the file that motivated
      # it.
      - name: A backtick inside an HTML comment must be rejected
        run: |
          printf 'const x = html`<!-- see `.foo` for this -->`;\n' > apps/web/src/prose-probe.js
          if node scripts/check-prose.mjs > /dev/null 2>&1; then
            echo "::error::The prose gate ACCEPTED a backtick inside an HTML comment. That construct ends the template literal and ships a runtime page error — it has done so three times."
            rm -f apps/web/src/prose-probe.js
            exit 1
          fi
          rm -f apps/web/src/prose-probe.js

      - name: Prose over the ceiling must be rejected
        run: |
          # BIGGER THAN THE CEILING ITSELF, not merely bigger than the
          # headroom. The first version wrote 3 KB, which only exceeded
          # 19.5 because the tree already held 19.2 — so the day somebody
          # cleaned the comments out of a few screens, this step would
          # have gone quietly green while proving nothing. A probe that
          # is over the limit on its own fails whatever the base is.
          { printf 'const x = html`<!--'; for i in $(seq 1 3000); do printf ' padding'; done; printf '\055\055>`;\n'; } > apps/web/src/prose-probe.js
          if node scripts/check-prose.mjs > /dev/null 2>&1; then
            echo "::error::The prose gate ACCEPTED 23 KB of new comment inside a template literal. That is string content no minifier removes — weight charged to a reporter on the connection this product exists to respect."
            rm -f apps/web/src/prose-probe.js
            exit 1
          fi
          rm -f apps/web/src/prose-probe.js

      # A zero-state that is a dead end. /triage said "Nothing on this
      # device yet" with `href="/report"` nowhere in the file — the first
      # screen a new operator opens, empty of the one thing the whole
      # product exists to start, with no way forward on it. The sed
      # matches the href rather than the sentence around it, so rewording
      # the copy cannot quietly turn this step green.
      - name: A zero-state whose record is made elsewhere and links nowhere must be rejected
        run: |
          cp apps/web/src/tools/triage/index.js /tmp/triage.bak
          sed -i 's|href="/report"|href="#"|' apps/web/src/tools/triage/index.js
          if node scripts/check-empty-states.mjs > /dev/null 2>&1; then
            echo "::error::The zero-state gate ACCEPTED /triage with no link to /report. That is the state it shipped in: the reporting queue, empty, offering nowhere to go."
            cp /tmp/triage.bak apps/web/src/tools/triage/index.js
            exit 1
          fi
          cp /tmp/triage.bak apps/web/src/tools/triage/index.js

      # A probe file rather than a real screen, for the reason the prose
      # steps above give: the rule holds over EVERY screen, so tying its
      # proof to one file's current text makes the proof go stale the
      # moment that file is cleaned.
      - name: A new zero-state with no declaration must be rejected
        run: |
          printf 'export const probe = () => `<p class="empty-state"><span>Nothing yet.</span></p>`;\n' \
            > apps/web/src/tools/coverage/zero-probe.js
          if node scripts/check-empty-states.mjs > /dev/null 2>&1; then
            echo "::error::The zero-state gate ACCEPTED a screen rendering a zero-state with no entry in WAY_FORWARD. A new screen would ship without anybody deciding where its first record is made."
            rm -f apps/web/src/tools/coverage/zero-probe.js
            exit 1
          fi
          rm -f apps/web/src/tools/coverage/zero-probe.js

      # A pack whose identity block is PRESENT but not PAINTED. The first
      # version of check:deliverables counted DOM nodes and this exact
      # mutation left it green — the element was there, the pack printed
      # anonymous, and existence cannot tell those apart. It needs the
      # built bundle, so it runs after the build in the verify job rather
      # than here; this step guards the source rule instead.
      - name: The deliverables gate must measure paint, not DOM presence
        run: |
          if ! grep -q "getBoundingClientRect" scripts/check-deliverables.mjs; then
            echo "::error::check-deliverables.mjs no longer measures a bounding box. A gate that counts elements passes over a print identity block hidden by display:none — mutation-checked, it did."
            exit 1
          fi

      - name: A trial length typed on /about that disagrees with TRIAL_DAYS must be rejected
        run: |
          cp apps/web/src/content/pages.js /tmp/pages.bak
          sed -i 's/and thirty days in which/and sixty days in which/' apps/web/src/content/pages.js
          if node scripts/check-claims.mjs > /dev/null 2>&1; then
            echo "::error::The claims gate ACCEPTED /about promising sixty days while TRIAL_DAYS is 30. Every count this gate guards is a numeral, and a spelled-out number is how this one shipped."
            cp /tmp/pages.bak apps/web/src/content/pages.js
            exit 1
          fi
          cp /tmp/pages.bak apps/web/src/content/pages.js

      - name: A present-tense partial claim with no PARTIAL element must be rejected
        run: |
          cp apps/web/src/content/pages.js /tmp/pages.bak
          sed -i "s/title: 'What twelve of twelve does not mean, and/title: 'What is still partial, and/" apps/web/src/content/pages.js
          if node scripts/check-claims.mjs > /dev/null 2>&1; then
            echo "::error::The claims gate ACCEPTED /about saying an element IS partial while the coverage table grades none. The existing assertion only checks that PARTIAL elements are named — with zero of them it iterates an empty list and passes."
            cp /tmp/pages.bak apps/web/src/content/pages.js
            exit 1
          fi
          cp /tmp/pages.bak apps/web/src/content/pages.js

      - name: And the restored sources must pass
        run: |
          node scripts/check-brand.mjs
          node scripts/check-claims.mjs
          node scripts/check-prose.mjs
          node scripts/check-empty-states.mjs
