# The gates run before the bundle. A deploy that skipped them would
# publish a page whose contrast claims nobody checked, which is the
# failure mode scripts/check-brand.mjs exists to prevent — so `build`
# depends on `check` and there is no fast path around it.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Preview and branch deploys skip the ~150 MB browser download. The
  # PRODUCTION context below installs it deliberately — see there.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# ---------------------------------------------------------------------
# PRODUCTION PUBLISHES NOTHING THAT HAS NOT BEEN DRIVEN IN A BROWSER.
#
# The line above used to read "Netlify never runs it, so skip the
# download", and it was TRUE and it was the reason six gates ran
# nowhere. They ran in GitHub Actions, which has not executed a step
# since 19 August 2026 — measured on 8 September with a workflow
# carrying no checkout and one `echo`, which failed in four seconds like
# all the others. So `smoke`, `check:a11y`, `check:deliverables`,
# `check:first-run`, `check:symmetry` and `check:update` had no home at
# all: `npm run build` is `check` plus the build steps, and `verify` is
# a superset nothing called.
#
# They are the gates that catch what a source-level check cannot. The
# accessibility sweep found `.stat__label` at 1.09:1 — not low contrast,
# INVISIBLE, four labels on /fatigue saying what each figure counted.
# The deliverables gate caught a print identity block present in the DOM
# and not painted, so the handover pack printed anonymous. Neither is
# visible to anything that reads source.
#
# PRODUCTION ONLY, and that is the trade. They cost 486 seconds against
# a 56-second build, measured on 8 September. Running them on previews
# too would double that for a signal `npm run gate` already gives before
# the merge. The property being bought here is narrower and is the one
# that matters: NOTHING REACHES AN OPERATOR WITHOUT HAVING BEEN DRIVEN.
#
# AND A BLOCKED DEPLOY IS NOW NOTICED, which is what makes this safe to
# do at all. Netlify is atomic, so a failed build leaves the last good
# deploy serving and says nothing — that is exactly how this repository
# lost seventeen days of publishing. Since 8 September the watchdog
# compares the SERVED commit against what `main` points at and alarms
# after 45 minutes. Without that, adding a gate that can block
# publishing would have been trading a rare bad deploy for a silent
# stale one.
#
# THE SKIP FLAG ABOVE STILL APPLIES HERE, AND THAT IS DELIBERATE rather
# than an oversight. It suppresses the download during `npm ci`; the
# EXPLICIT `playwright install` below ignores it. Measured rather than
# assumed, because getting it wrong blocks every production deploy:
#
#   PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npx playwright install chromium --dry-run
#   -> browser: chromium version 141.0.7390.37, download url ..., exit 0
#
# So the install is not skipped, and `npm ci` is not made slower twice
# over. Do not "fix" this by setting the flag to 0.
#
# If a build ever times out here, trim this list rather than deleting
# it: check:deliverables, check:first-run and check:update together
# cost 38 seconds of the 486.
# ---------------------------------------------------------------------
[context.production]
  command = "npm run build && npx playwright install chromium && npm run gate:bundle"

[context.production.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # Prisma's query engine is a native binary and is not traced by the
  # bundler's static analysis. Without this the function deploys and
  # then fails at runtime with a missing-engine error that reads like a
  # Prisma bug rather than a packaging one.
  included_files = ["node_modules/.prisma/client/**", "prisma/**"]
  external_node_modules = ["@prisma/client", ".prisma/client", "argon2"]

# The CSP is the mechanism behind this product's half of charter rule 7.
# Nothing off-origin: no font CDN, no analytics, no tag manager. The
# connect-src allowance is the API and nothing else, so a dependency that
# starts phoning home fails visibly rather than quietly.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    # NO-REFERRER, AND `strict-origin-when-cross-origin` WAS LEAKING A
    # CREDENTIAL. That policy sends the FULL URL on SAME-ORIGIN requests
    # — it only strips the path when crossing origins — and a
    # password-reset link is /reset?token=<32 random bytes>. Measured
    # rather than reasoned about: a real browser submitting the reset
    # form sent
    #
    #   Referer: /reset?token=REFERER-PROBE-TOKEN-0123456789abcdefghij
    #
    # to POST /api/v1/auth/reset, which puts a live credential in the
    # access log of every hop that records one. The module fetch for the
    # screen's own chunk carries it too, and that fires before any line
    # of application code runs — so no amount of care inside the screen
    # could have closed it.
    #
    # `no-referrer` costs this product nothing. The CSP one line above
    # already forbids off-origin requests, there is no analytics, and
    # authentication is a Bearer token rather than anything that reads
    # Referer. Nothing in the app was using the header for anything.
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    # Added when usalamasms.com became the official origin. Until there
    # was a domain of the product's own there was nothing to pin: a
    # netlify.app subdomain inherits whatever policy that apex carries.
    #
    # A year, and subdomains included, because every host under this
    # domain is part of the same product and a safety narrative must not
    # travel to any of them in clear. NOT `preload` — that submits the
    # domain to a browser-vendor list which is slow and awkward to leave,
    # and it is a commitment the operator of the domain should make
    # deliberately rather than one a header file makes for them.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ============================================================
# THE SPA FALLBACK, WHICH DID NOT EXIST.
#
# This file had no redirects at all. Netlify serves a static publish
# directory, so /report, /triage, /account and /design — every route
# this app has except the root — resolved to Netlify's 404 page on the
# deployed site. Only the root worked, and only because dist/index.html
# happens to be there.
#
# It got worse the moment the manifest's start_url moved to /report:
# the launch URL of the INSTALLED app was a 404.
#
# Nothing caught it because scripts/smoke.mjs ran its own static server
# that fell back to index.html unconditionally, under a comment saying
# it "mirrors the SPA fallback Netlify provides". Netlify provided
# nothing of the kind. That server now reads the rules below and applies
# them, so deleting this block fails the deep-link checks — which is how
# it was verified.
#
# 200 rather than 301: the URL must stay what the person asked for, or
# the router has nothing to route on. An existing file still wins —
# Netlify prefers a real asset over a rewrite unless force is set, so
# /sw.js, /manifest.json and the hashed bundles are untouched. And
# /api/* never reaches here at all: netlify/functions/api.mts declares
# `config.path = "/api/*"`, and function routes are matched first.
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
