# The gates run before the bundle. A deploy that skipped them would
# publish a page whose contrast claims nobody checked, which is the
# failure mode scripts/check-brand.mjs exists to prevent — so `build`
# depends on `check` and there is no fast path around it.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The smoke suite installs its own Chromium in CI; Netlify never runs
  # it, so skip the ~150 MB browser download on every deploy.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"
  # Prisma's query engine is a native binary and is not traced by the
  # bundler's static analysis. Without this the function deploys and
  # then fails at runtime with a missing-engine error that reads like a
  # Prisma bug rather than a packaging one.
  included_files = ["node_modules/.prisma/client/**", "prisma/**"]
  external_node_modules = ["@prisma/client", ".prisma/client", "argon2"]

# The CSP is the mechanism behind this product's half of charter rule 7.
# Nothing off-origin: no font CDN, no analytics, no tag manager. The
# connect-src allowance is the API and nothing else, so a dependency that
# starts phoning home fails visibly rather than quietly.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# ============================================================
# THE SPA FALLBACK, WHICH DID NOT EXIST.
#
# This file had no redirects at all. Netlify serves a static publish
# directory, so /report, /triage, /account and /design — every route
# this app has except the root — resolved to Netlify's 404 page on the
# deployed site. Only the root worked, and only because dist/index.html
# happens to be there.
#
# It got worse the moment the manifest's start_url moved to /report:
# the launch URL of the INSTALLED app was a 404.
#
# Nothing caught it because scripts/smoke.mjs ran its own static server
# that fell back to index.html unconditionally, under a comment saying
# it "mirrors the SPA fallback Netlify provides". Netlify provided
# nothing of the kind. That server now reads the rules below and applies
# them, so deleting this block fails the deep-link checks — which is how
# it was verified.
#
# 200 rather than 301: the URL must stay what the person asked for, or
# the router has nothing to route on. An existing file still wins —
# Netlify prefers a real asset over a rewrite unless force is set, so
# /sw.js, /manifest.json and the hashed bundles are untouched. And
# /api/* never reaches here at all: netlify/functions/api.mts declares
# `config.path = "/api/*"`, and function routes are matched first.
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
