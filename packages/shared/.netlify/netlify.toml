headersOrigin = "config"
redirectsOrigin = "config"
functionsDirectory = "/opt/build/repo/netlify/functions"
functionsDirectoryOrigin = "config"

[functions]

[functions."*"]
external_node_modules = ["@prisma/client", ".prisma/client", "argon2"]
included_files = ["node_modules/.prisma/client/**", "prisma/**"]

[[plugins]]
origin = "ui"
package = "@netlify/plugin-lighthouse"
pinned_version = "6.0.1"

[plugins.inputs]

[[plugins]]
origin = "ui"
package = "netlify-plugin-debug-cache"
pinned_version = "1"

[plugins.inputs]

[[plugins]]
origin = "ui"
package = "@netlify/plugin-sitemap"
pinned_version = "0.8"

[plugins.inputs]

[build]
publish = "/opt/build/repo/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"
functions = "/opt/build/repo/netlify/functions"

[build.environment]
NODE_VERSION = "22"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"
X-Frame-Options = "DENY"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]